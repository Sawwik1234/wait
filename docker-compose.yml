# CaseArena — production-like stack
# Dev profile (sandbox) uses SQLite without Docker; see README.
#
#   docker compose up -d          # postgres + api + web
#   docker compose --profile nginx up -d   # + reverse proxy on :80

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casearena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casearena}
      POSTGRES_DB: casearena
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casearena']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://casearena:${POSTGRES_PASSWORD:-casearena}@postgres:5432/casearena?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@casearena.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#12345}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PORT: 4000
      LIVEFEED_ENABLED: '1'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - '3000:3000'

  nginx:
    image: nginx:1.27-alpine
    profile: nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    ports:
      - '80:80'

volumes:
  pgdata:
